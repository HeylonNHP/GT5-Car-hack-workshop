name: Windows release

# Build a Windows x64 release and publish it as a GitHub Release every time a
# commit lands on master. Also runnable by hand from the Actions tab.

on:
  push:
    branches: [ master ]
  workflow_dispatch:

# Needed so the job can create a release with the built-in token.
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Read the version out of the project file
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content "GT5 Car hack workshop/GT5 Car hack workshop.csproj"
          $v = ($proj.Project.PropertyGroup | Where-Object { $_.Version } |
                Select-Object -First 1).Version
          if (-not $v) { throw "Could not read <Version> from the csproj" }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Publish for Windows x64
        run: >
          dotnet publish "GT5 Car hack workshop/GT5 Car hack workshop.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:DebugType=none
          --output publish

      # Fail loudly here rather than shipping a release that is missing a file the
      # app needs at runtime. partscatalogue.db in particular is 8.8 MB and is
      # copied by a csproj rule rather than being compiled in, so it is worth
      # proving it reached the output.
      - name: Verify the runtime files reached the publish output
        shell: pwsh
        run: |
          $needed = @(
            "publish/GT5 Car hack workshop.exe",
            "publish/partscatalogue.db",
            "publish/partsdatabase.db"
          )
          foreach ($f in $needed) {
            if (-not (Test-Path $f)) { throw "Missing from the publish output: $f" }
            Write-Host ("OK   {0}   ({1:N0} bytes)" -f $f, (Get-Item $f).Length)
          }

      - name: Zip the build
        id: zip
        shell: pwsh
        run: |
          $name = "GT5-Car-hack-workshop-${{ steps.version.outputs.version }}-win-x64"
          Compress-Archive -Path publish/* -DestinationPath "$name.zip"
          "file=$name.zip" >> $env:GITHUB_OUTPUT
          Write-Host ("Archive: {0} ({1:N0} bytes)" -f "$name.zip", (Get-Item "$name.zip").Length)

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: v${{ steps.version.outputs.version }} (build ${{ github.run_number }})
          files: ${{ steps.zip.outputs.file }}
          body: |
            Windows x64 release build, built automatically from `${{ github.sha }}`.

            **${{ github.event.head_commit.message }}**

            Unzip and run `GT5 Car hack workshop.exe`. This build is self-contained,
            so no separate .NET installation is needed. Save decryption and
            encryption are built in, so nothing else is required.
